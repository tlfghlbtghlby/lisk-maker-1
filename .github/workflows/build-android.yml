name: Build Android APK

on:
  push:
    branches: [ Android ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          rm -f package-lock.json bun.lock
          npm cache clean --force
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install -D @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Web Application
        run: npm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Initialize and Sync Android Project
        run: |
          # 1. التأكد من وجود ملف إعداد Capacitor
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId":"com.listmaker.pos","appName":"برنامج المفكر المحاسبي","webDir":"dist"}' > capacitor.config.json
          fi

          # 2. إنشاء مجلد أندرويد إذا لم يكن موجوداً
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli add android
          fi

          # 3. مزامنة الملفات المبنية مع مشروع أندرويد
          npx --yes @capacitor/cli sync android


      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AlMufakir-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
